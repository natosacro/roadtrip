        '<span class="g-righe" aria-hidden="true"><i></i><i></i><i></i></span>' +
        '<span class="g-sub">Family owned since 2020</span></header>' +
      '<div class="hazard" aria-hidden="true"></div>' +
      drawer("CHIAVE DELL'OFFICINA", "#8A6A22",
        '<div class="keybox"><svg class="shopkey" viewBox="0 0 96 132" aria-hidden="true"><rect x="30" y="2" width="36" height="12" rx="3" fill="#6E757D"/><circle cx="40" cy="8" r="2" fill="#C9CCD1"/><circle cx="56" cy="8" r="2" fill="#C9CCD1"/><path d="M48 14v8q0 6-6 6" fill="none" stroke="#3A3F45" stroke-width="3.5" stroke-linecap="round"/><circle cx="40" cy="36" r="9" fill="none" stroke="#9AA1A9" stroke-width="3"/><g transform="rotate(-8 40 60)"><circle cx="40" cy="58" r="13" fill="#C9A14A" stroke="#8A6A22" stroke-width="2.5"/><circle cx="40" cy="58" r="5.5" fill="#2B2D31"/><rect x="36.5" y="70" width="7" height="44" rx="2" fill="#C9A14A" stroke="#8A6A22" stroke-width="2"/><path d="M43 98h9v5h-5v4h6v6h-10z" fill="#C9A14A" stroke="#8A6A22" stroke-width="2" stroke-linejoin="round"/><path d="M39 74v36" stroke="#F1D98A" stroke-width="1.5" opacity=".7"/></g><path d="M48 40 70 62" stroke="#B8A47A" stroke-width="1.5"/><g transform="rotate(12 76 84)"><path d="M62 64h28v40H62z" fill="#EBDDB3" stroke="#B8A47A" stroke-width="1.5"/><circle cx="76" cy="70" r="2.6" fill="#AEB4BB" stroke="#7E858D"/><text x="76" y="86" text-anchor="middle" font-family="Courier Prime,monospace" font-weight="700" font-size="8.5" fill="#5A2E14">SHOP</text><text x="76" y="96" text-anchor="middle" font-family="Courier Prime,monospace" font-weight="700" font-size="8.5" fill="#5A2E14">KEY</text></g></svg><div class="keybox-t">' + (ghKey()
          ? '<p><b>Chiave inserita.</b></p><button type="button" class="btn" id="key-off">Togli la chiave da questo telefono</button>'
          : '<input type="password" id="key-in" class="key-in" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false">' +
            '<button type="button" class="btn" id="key-on">Inserisci la chiave</button><p id="key-st" class="key-st"></p>') + '</div></div>') +
      drawer("TEMA", "#1B1B1B", seg("theme", [["auto", "Auto"], ["light", "Giorno"], ["dark", "Notte"]])) +
      drawer("DISTANZE", "#B3261E", seg("units", [["km", "km"], ["mi", "miglia"], ["both", "entrambe"]])) +
      // la prova serve solo prima della partenza: dall'8 dicembre sparisce
      (tripStarted() ? '' : drawer("PROVA UN GIORNO", "#1F4E8C", seg("test", [["", "No"], ["1", "8"], ["2", "9"], ["3", "10"], ["4", "11"], ["5", "12"], ["6", "13"]]))) +
      drawer("INSTALLA SUL TELEFONO", "#1B1B1B",
        '<p><b>Android (Chrome):</b> menu ⋮ → Installa app.</p><p><b>iPhone (Safari):</b> Condividi → Aggiungi alla schermata Home.</p>' +
        '<button type="button" class="btn" id="install" hidden>Installa adesso</button>') +
      '<section class="bolla"><span class="clip" aria-hidden="true"></span>' +
        '<p class="bolla-h">ORDINE DI LAVORO · N. 2026-12</p>' +
        '<p><b>Una bozza da scrivere insieme.</b> Il percorso e le attività sono un punto di partenza, non un programma fisso. Ogni punto può cambiare, anche all\'ultimo momento, in itinere.</p>' +
        '<p><b>Fonti.</b> Prezzi e orari verificati tra ottobre e novembre 2026. Le fonti sono nella presentazione.</p>' +
        '<p class="firma">Officina Road trip · bozza 0.1</p></section>' +
      '<div class="stopbtn"><button type="button" class="emergenza" id="reset" aria-label="Ripristina le impostazioni"></button><span>RIPRISTINA</span></div>' +
    '</div>';
}
function initImpostazioni() {
  var kon = document.getElementById("key-on"), koff = document.getElementById("key-off");
  if (kon) kon.onclick = function () {
    var v = document.getElementById("key-in").value.trim(), st = document.getElementById("key-st");
    if (!v) return;
    try { localStorage.setItem("rta-key", v); } catch (e) {}
    st.textContent = "Collegamento…";
    loadPrivate().then(function (ok) {
      if (!ok) throw 0;
      return pullBudget();
    }).then(function () { toast("Chiave inserita"); render(); })
      .catch(function () { try { localStorage.removeItem("rta-key"); } catch (e) {} st.textContent = "Chiave non valida"; });
  };
  if (koff) koff.onclick = function () {
    try { localStorage.removeItem("rta-key"); localStorage.removeItem("rta-priv"); } catch (e) {}
    PRIV = Object.assign({}, PRIV_PUBLIC); render();
  };
  document.querySelectorAll("[data-set]").forEach(function (b) {
    b.addEventListener("click", function () {
      settings[b.getAttribute("data-set")] = b.getAttribute("data-val");
      save(); applyTheme(); render();
    });
  });
  var r = document.getElementById("reset");
  if (r) r.onclick = function () { settings = Object.assign({}, DEFAULTS); save(); applyTheme(); render(); };
  var ib = document.getElementById("install");
  if (ib) {
    ib.hidden = !deferredInstall;
    ib.onclick = function () { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; ib.hidden = true; } };
  }
}

/* =====================================================================
   ROUTER (hash: #mappa, #leg, #leg-3, #guida-mercatini, …)
   ===================================================================== */
var app = document.getElementById("app");
var lastHash = null;
function render() {
  var h = (location.hash || "#home").slice(1) || "home", tab = h.split("-")[0], html = "", init = null;
  if (h === "home") { html = viewHome(); init = function () { renderNavCard(); refreshInstallBanner(); }; }
  else if (h === "mappa") { html = viewMappa(); init = initMap; }
  else if (/^mappa-leg\d$/.test(h)) { var sl = +h.slice(9); html = viewMappa(sl); init = function () { initMap(sl); }; }
  else if (h === "strade") html = viewStrade();
  else if (/^strada-/.test(h)) { html = viewStrada(bySlug(h.slice(7))); tab = "strade"; }
  else if (/^cantone-/.test(h)) { html = viewCantone(h.slice(8).toUpperCase()); tab = "strade"; }
  else if (h === "leg") html = viewLegList();
  else if (/^leg-\d$/.test(h)) html = viewLeg(+h.slice(4));
  else if (h === "guida") html = viewGuida();
  else if (h === "guida-mercatini") { html = viewMercatini(); init = initMercatini; }
  else if (h === "guida-vegano") html = viewVegano();
  else if (h === "guida-racchette") html = viewRacchette();
  else if (h === "guida-budget") { html = viewBudget(); init = initBudget; }
  else if (h === "rubrica") { html = viewRubrica(); init = initRubrica; tab = "guida"; }
  else if (h === "impostazioni") { html = viewImpostazioni(); init = initImpostazioni; }
  else if (h === "radio") { html = viewRadio(); init = initRadio; }
  else { html = viewHome(); init = renderNavCard; tab = "home"; }
  app.innerHTML = P(html);
  if (init) init();
  document.querySelectorAll(".tabbar a").forEach(function (a) {
    if (a.getAttribute("data-tab") === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (lastHash !== h) window.scrollTo(0, 0);
  lastHash = h;
}
window.addEventListener("hashchange", render);
render();
if (ghKey()) loadPrivate().then(function (ok) { if (ok) render(); }).catch(function () {}).then(pullBudget);

/* ---------- Swipe tra i tab (come in Agrolandia) ----------
   Scorrendo a sinistra o a destra la pagina segue il dito; lasciando, scivola fuori e il tab vicino entra
   dal lato opposto. Non vale sulla barra in basso, sulla mappa, sulle casette dei mercatini e sui campi. */
(function () {
  var ORDINE = ["home", "mappa", "leg", "strade", "guida", "radio"];
  var TAB_DI = { strada: "strade", cantone: "strade", rubrica: "guida" };
  function tabCorrente() {
    var h = (location.hash || "#home").slice(1) || "home", t = h.split("-")[0];
    t = TAB_DI[t] || t;
    return ORDINE.indexOf(t) === -1 ? "home" : t;
  }
  var main = document.getElementById("app");
  var x0 = null, y0 = 0, t0 = 0, dx = 0, dir = null;
  function muovi(x, op, ms) {
    main.style.transition = ms ? "transform " + ms + "ms cubic-bezier(.2,.7,.2,1), opacity " + ms + "ms ease" : "none";
    main.style.transform = x ? "translateX(" + x + "px)" : "";
    main.style.opacity = op === 1 ? "" : op;
  }
  document.addEventListener("touchstart", function (e) {
    if (location.hash === "#impostazioni" || e.touches.length !== 1 || e.target.closest(".tabbar, input, select, textarea, button.num-in, #map, .carousel, .book")) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); dx = 0; dir = null;
  }, { passive: true });
  document.addEventListener("touchmove", function (e) {
    if (x0 === null) return;
    dx = e.touches[0].clientX - x0;
    var dy = e.touches[0].clientY - y0;
    if (!dir && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) dir = Math.abs(dx) > Math.abs(dy) * 1.2 ? "h" : "v";
    if (dir !== "h") return;
    e.preventDefault();
    var i = ORDINE.indexOf(tabCorrente()), bordo = (i === 0 && dx > 0) || (i === ORDINE.length - 1 && dx < 0);
    // la pagina si sposta poco (al massimo 70 px) e sbiadisce: niente spazio vuoto di lato
    var d = Math.max(-70, Math.min(70, dx * (bordo ? 0.12 : 0.3)));
    muovi(d, bordo ? 1 : 1 - Math.min(0.5, Math.abs(dx) / innerWidth * 0.8), 0);
  }, { passive: false });
  document.addEventListener("touchend", function () {
    if (x0 === null) return;
    x0 = null;
    if (dir !== "h") return;
    var W = innerWidth, i = ORDINE.indexOf(tabCorrente()), j = i + (dx < 0 ? 1 : -1);
    var veloce = Math.abs(dx) / Math.max(1, Date.now() - t0) > 0.45 && Math.abs(dx) > 40;
    if (j < 0 || j >= ORDINE.length || !(Math.abs(dx) > W * 0.25 || veloce)) { muovi(0, 1, 200); return; }
    var verso = dx < 0 ? -1 : 1;
    muovi(verso * 70, 0, 120);
    setTimeout(function () {
      window.addEventListener("hashchange", function entra() {
        window.removeEventListener("hashchange", entra);
        muovi(-verso * 50, 0, 0);
        void main.offsetWidth;
        muovi(0, 1, 200);
      });
      location.hash = ORDINE[j];
    }, 120);
  }, { passive: true });
  document.addEventListener("touchcancel", function () { if (x0 !== null) { x0 = null; muovi(0, 1, 200); } }, { passive: true });
  // anche toccando la barra dei tab il cambio è morbido
  document.querySelectorAll(".tabbar a").forEach(function (a) {
    a.addEventListener("click", function () {
      if (main.animate) main.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 200, easing: "ease-out" });
    });
  });
})();
loadTcs();
loadEtzel();

if ("serviceWorker" in navigator && window.isSecureContext) {
  try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
}
})();
</script>
