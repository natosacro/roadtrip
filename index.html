/* Layout: app a colonna singola, cartelli autostradali verdi come titoli, barra a 5 tab fissa in basso. */
:root {
  --carta: #EFE4D2;        /* fondo, come le slide */
  --carta-2: #E4D6BF;      /* superfici incassate */
  --card: #FFFCF6;         /* card */
  --bordo: #B29C82;        /* filetti */
  --testo: #2B2019;
  --testo-2: #6B5A4C;
  --verde: #0F6B4C;        /* cartello autostradale */
  --su-verde: #FFFFFF;
  --rosso: #B5432F;        /* pillole orario, tracciato */
  --oro: #E2A93B;          /* numeri delle leg */
  --marrone: #3A2A20;      /* card scure */
  --su-marrone: #F4E9D8;
  --etichetta: #E9B24A;    /* etichette su marrone */
  --blu: #1F4E8C;          /* riquadri info */
  --turistico: #6A4126;    /* cartelli marroni */
  --treno: #2456A4;
  --bus: #7B4E9A;
  --mappa: #F7EFE1;
  --mappa-ink: #2B2019;
  --strada: #2F2A27;
  --nav: #FFFCF6;
  /* oggetti illustrati: stessi colori in entrambi i temi */
  --legno: #7E5234;
  --legno-2: #6E4629;
  --tetto: #4E3222;
  --neve: #FFFFFF;
  --carta-scontrino: #FFFDF7;
  --ink-scontrino: #2B2019;
  --nb-copertina: #7A2B2B;
  --nb-carta: #FBF6EA;
  --nb-riga: #BCD0E4;
  --nb-margine: #E3A49B;
  --nb-ink: #2747A0;
  --neon: #1E8C86;
  --cielo-1: #17152B;
  --cielo-2: #3A2140;
  --cielo-3: #8C4A48;
  --monti-1: #3B2A36;
  --monti-2: #241B24;

  --f-cartello: "Overpass", "Highway Gothic", "Arial Narrow", Arial, sans-serif;
  --f-titolo: "Bitter", "Rockwell", Georgia, serif;
  --f-testo: "Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mano: "Patrick Hand", "Comic Sans MS", "Bradley Hand", cursive;
  --f-cassa: "Courier Prime", "Courier New", monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #1C1A2A; --carta-2: #262337; --card: #2A2740; --bordo: #4C4566;
    --testo: #F1E6D8; --testo-2: #B9AFC4; --verde: #127552; --rosso: #C2523C;
    --marrone: #120F1C; --blu: #24569A; --turistico: #6E4429;
    --mappa: #24213A; --mappa-ink: #F1E6D8; --nav: #221F33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #1C1A2A; --carta-2: #262337; --card: #2A2740; --bordo: #4C4566;
  --testo: #F1E6D8; --testo-2: #B9AFC4; --verde: #127552; --rosso: #C2523C;
  --marrone: #120F1C; --blu: #24569A; --turistico: #6E4429;
  --mappa: #24213A; --mappa-ink: #F1E6D8; --nav: #221F33;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* pagine fisse come in Agrolandia: niente zoom con due dita né doppio tocco (la mappa ha i suoi gesti) */
html, body { touch-action: pan-y; }
.carousel { touch-action: pan-x pan-y; }
body {
  margin: 0; background: var(--carta); color: var(--testo);
  font-family: var(--f-testo); font-size: 1rem; line-height: 1.45;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-block: env(safe-area-inset-top, 0px) calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--carta);
}
main { max-width: 40rem; margin-inline: auto; display: grid; gap: 18px; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

/* ---------- Cartello autostradale ---------- */
.sign {
  position: relative; margin-top: 16px; background: var(--verde); color: var(--su-verde);
  border-radius: 12px; padding: 11px 16px 10px;
  box-shadow: inset 0 0 0 3px var(--verde), inset 0 0 0 5.5px var(--su-verde), 0 1px 0 rgba(0,0,0,.08);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.sign h1 { font-family: var(--f-cartello); font-weight: 700; font-size: 1.3rem; line-height: 1.15; min-width: 0; }
.sign-tab {
  position: absolute; left: 16px; bottom: calc(100% - 6px); padding: 6px 16px 9px;
  background: var(--verde); border-radius: 9px 9px 0 0;
  box-shadow: inset 0 0 0 3px var(--verde), inset 0 0 0 5.5px var(--su-verde);
  font-family: var(--f-cartello); font-weight: 700; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
}
.sign-tab::after {
  content: ""; position: absolute; left: 5.5px; right: 5.5px; bottom: -6px; height: 12px; background: var(--verde);
}
.shields { display: flex; gap: 4px; flex-shrink: 0; }
.shields svg { width: 26px; height: 29px; display: block; }
.diamond {
  width: 32px; height: 32px; flex-shrink: 0; display: grid; place-items: center;
  background: #F08A24; border: 2px solid #2B2019; transform: rotate(45deg); border-radius: 4px; margin-right: 6px;
}
.diamond span { transform: rotate(-45deg); color: #2B2019; font: 800 .45rem/1.05 var(--f-cartello); text-align: center; text-transform: uppercase; }

.back {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  font-family: var(--f-cartello); font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--testo-2); padding: 14px 0 0;
}
.lead { color: var(--testo-2); font-size: .98rem; }
.label {
  font-family: var(--f-cartello); font-weight: 700; font-size: .68rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--rosso);
}

/* ---------- Hero notturno (tab mappa) ---------- */
.hero {
  margin-left: calc(-1 * var(--gutter-l)); margin-right: calc(-1 * var(--gutter-r));
  position: relative; overflow: hidden; color: #F3E9D6;
  background:
    radial-gradient(1px 1px at 12% 22%, #fff 99%, transparent) ,
    radial-gradient(1px 1px at 28% 12%, #fff 99%, transparent),
    radial-gradient(1.5px 1.5px at 47% 30%, #fff 99%, transparent),
    radial-gradient(1px 1px at 63% 9%, #fff 99%, transparent),
    radial-gradient(1px 1px at 78% 26%, #fff 99%, transparent),
    radial-gradient(1.5px 1.5px at 90% 14%, #fff 99%, transparent),
    radial-gradient(1px 1px at 36% 40%, #fff 99%, transparent),
    radial-gradient(1px 1px at 70% 42%, #fff 99%, transparent),
    linear-gradient(180deg, var(--cielo-1) 0%, var(--cielo-2) 58%, var(--cielo-3) 100%);
}
.hero-inner {
  max-width: 40rem; margin-inline: auto; position: relative; z-index: 1;
  padding: 26px var(--gutter-r) 74px var(--gutter-l); display: grid; gap: 4px;
}
.hero h1 { font-family: var(--f-titolo); font-weight: 700; font-size: clamp(1.9rem, 8vw, 2.6rem); line-height: 1.05; }
.hero .date { font-family: var(--f-testo); font-weight: 700; color: var(--oro); font-size: 1.05rem; }
.countdown {
  justify-self: start; text-decoration: none; color: inherit; margin-top: 10px; display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); border-radius: 999px;
  padding: 5px 12px; font-family: var(--f-cartello); font-weight: 700; font-size: .78rem; letter-spacing: .06em;
}
.countdown b { color: var(--oro); font-size: .95rem; font-variant-numeric: tabular-nums; }
.hero svg.monti { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 78px; display: block; }
.shooting { position: absolute; top: 22px; right: 12%; width: 90px; height: 2px; transform: rotate(18deg);
  background: linear-gradient(90deg, transparent, #fff); opacity: .8; border-radius: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .shooting { animation: shoot 6s ease-in-out infinite; }
  @keyframes shoot { 0%, 70% { opacity: 0; transform: translate(-40px,-12px) rotate(18deg); } 80% { opacity: .9; } 100% { opacity: 0; transform: translate(30px, 10px) rotate(18deg); } }
}

/* ---------- Mappa ---------- */
.mapbox {
  position: relative; border: 2px solid var(--marrone); border-radius: 12px; overflow: hidden;
  background: var(--mappa); aspect-ratio: 520 / 452; max-height: 72vh;
  margin-left: calc(10px - var(--gutter-l)); margin-right: calc(10px - var(--gutter-r));
}
.mapbox svg { width: 100%; height: 100%; display: block; touch-action: pan-x pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.mapbox svg.dragging { cursor: grabbing; }
.map-2dita {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: rgba(20,16,12,.45); color: #fff; font-family: var(--f-cartello); font-weight: 700; font-size: 1rem; text-align: center; padding: 20px;
}
.map-2dita.show { opacity: 1; }
.map-ctrl { position: absolute; right: 8px; top: 8px; display: grid; gap: 6px; }
.map-ctrl button {
  width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid var(--marrone);
  background: var(--card); color: var(--testo); font-size: 1.2rem; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}
.map-hint { font-size: .84rem; color: var(--testo-2); margin-top: -8px; text-align: center; }
.m-paper { fill: var(--mappa); }
.m-frame { fill: none; stroke: var(--bordo); stroke-width: 1.2; stroke-dasharray: 2 4; }
.m-hit { fill: none; stroke: transparent; stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
.m-case { fill: none; stroke: var(--mappa); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
.m-route { fill: none; stroke: var(--rosso); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; transition: stroke-width .15s; }
.m-route.treno { stroke: var(--treno); }
.m-route.bus { stroke: var(--bus); }
.m-route.ring { stroke-dasharray: 4 4; stroke-width: 2.5; }
.leg-g { cursor: pointer; }
.leg-g:hover .m-route, .leg-g.on .m-route { stroke-width: 6.5; }
.m-dot { fill: var(--mappa); stroke: var(--mappa-ink); stroke-width: 2.4; }
.m-dot.small { stroke-width: 1.6; }
.m-label {
  font-family: var(--f-cartello); font-weight: 800; font-size: 18px; fill: var(--mappa-ink);
  paint-order: stroke; stroke: var(--mappa); stroke-width: 4px; stroke-linejoin: round; pointer-events: none;
}
.m-minor {
  font-family: var(--f-cartello); font-weight: 700; font-size: 11px; fill: var(--testo-2);
  paint-order: stroke; stroke: var(--mappa); stroke-width: 3px; stroke-linejoin: round;
  opacity: 0; transition: opacity .25s; pointer-events: none;
}
svg.zoomed .m-minor { opacity: 1; }
.m-badge circle { fill: var(--oro); stroke: var(--marrone); stroke-width: 2; }
.m-badge text { font-family: var(--f-titolo); font-weight: 700; font-size: 16px; fill: #2B2019; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.m-bio { fill: #7FA65A; fill-opacity: .25; stroke: #5E8A3E; stroke-dasharray: 3 3; stroke-width: 1; }
.m-note { font-family: var(--f-testo); font-style: italic; font-size: 9px; fill: #4F7A35; pointer-events: none; }
.m-faint { fill: var(--testo-2); font-family: var(--f-cartello); font-weight: 700; font-size: 9px; }
.m-scale { stroke: var(--mappa-ink); stroke-width: 3; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  background: var(--card); border: 1.5px solid var(--bordo); border-radius: 999px; padding: 5px 12px 5px 5px;
  font-family: var(--f-cartello); font-weight: 700; font-size: .8rem;
}
.num {
  width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; flex-shrink: 0;
  background: var(--oro); border: 2px solid #3A2A20; color: #2B2019;
  font-family: var(--f-titolo); font-weight: 700; font-size: .92rem; line-height: 1;
}
.num.big { width: 42px; height: 42px; font-size: 1.3rem; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .85rem; color: var(--testo-2); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 26px; height: 4px; border-radius: 2px; background: var(--rosso); display: inline-block; }
.legend i.t { background: var(--treno); } .legend i.b { background: var(--bus); }

.odo {
  background: var(--marrone); color: var(--su-marrone); border-radius: 12px; padding: 14px 16px;
  display: grid; gap: 8px;
}
.odo .label { color: var(--etichetta); }
.odo-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.digits { display: flex; gap: 3px; }
.digits span {
  width: 30px; height: 40px; display: grid; place-items: center; border-radius: 4px;
  background: #FFFDF7; color: #2B2019; font-family: var(--f-cassa); font-weight: 700; font-size: 1.45rem;
  box-shadow: inset 0 -8px 10px -8px rgba(0,0,0,.35);
}
.digits span.z { background: #3A2E26; color: #7E6A58; }
.odo-row .u { font-family: var(--f-cartello); font-weight: 800; font-size: 1.1rem; line-height: 1.1; }
.odo-row .u small { display: block; font-weight: 600; font-size: .78rem; opacity: .8; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat {
  background: var(--card); border: 1.5px solid var(--bordo); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0;
}
.stat strong { font-family: var(--f-cartello); font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--testo-2); }
.trivia { font-size: .86rem; color: var(--testo-2); }
.trivia b { color: var(--rosso); font-family: var(--f-cartello); letter-spacing: .1em; font-size: .72rem; margin-right: 6px; }

/* ---------- Elenco leg ---------- */
.leglist { display: grid; gap: 10px; }
.legcard {
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-decoration: none;
  background: var(--card); border: 1.5px solid var(--bordo); border-radius: 12px; padding: 12px 12px 12px 10px;
}
.legcard:active { transform: scale(.99); }
.legcard .when { font-family: var(--f-cartello); font-weight: 800; font-size: .78rem; letter-spacing: .08em; color: var(--rosso); }
.legcard .route { font-weight: 700; font-size: 1.02rem; line-height: 1.25; }
.legcard .meta { font-size: .84rem; color: var(--testo-2); }
.legcard .body { min-width: 0; display: grid; gap: 2px; }
.chev { color: var(--testo-2); font-size: 1.3rem; }
.today { background: var(--verde); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: .65rem; letter-spacing: .1em; margin-left: 6px; vertical-align: 1px; }

/* ---------- Dettaglio leg ---------- */
.road { padding-top: 6px; }
.road-inner { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: relative; }
.road-inner::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 44px; border-radius: 22px;
  background:
    linear-gradient(var(--strada), var(--strada)) padding-box;
  box-shadow: inset 0 4px 0 -1px var(--strada), inset 0 6px 0 -1px #E8E1D6, inset 0 -6px 0 -1px #E8E1D6, inset 0 -4px 0 -1px var(--strada);
}
.road-inner::after {
  content: ""; position: absolute; left: 14px; right: 14px; top: 21px; height: 2.5px;
  background: repeating-linear-gradient(90deg, var(--oro) 0 14px, transparent 14px 24px);
}
.stop { position: relative; z-index: 1; display: grid; justify-items: center; gap: 8px; text-align: center; }
.stop i { width: 26px; height: 26px; margin-top: 9px; border-radius: 50%; background: #fff; border: 5px solid var(--rosso); display: block; }
.stop span { font-family: var(--f-cartello); font-weight: 700; font-size: .78rem; line-height: 1.15; padding-inline: 4px; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fact { border-radius: 10px; padding: 9px 12px; background: var(--marrone); color: var(--su-marrone); display: grid; gap: 1px; min-width: 0; }
.fact.g { background: var(--verde); color: #fff; }
.fact.wide { grid-column: 1 / -1; }
.fact small { font-family: var(--f-cartello); font-weight: 700; font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: var(--etichetta); }
.fact.g small { color: #CFE8DC; }
.fact b { font-weight: 700; font-size: .98rem; }
.fact b em { font-style: normal; font-weight: 400; opacity: .85; }

.timeline { display: grid; gap: 8px; }
.tl {
  display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: start;
  background: var(--card); border: 1.5px solid var(--bordo); border-radius: 10px; padding: 10px 12px 10px 8px;
}
.pill {
  background: var(--rosso); color: #fff; border-radius: 999px; padding: 4px 6px; text-align: center;
  font-family: var(--f-cartello); font-weight: 700; font-size: .6rem; letter-spacing: .06em; text-transform: uppercase; line-height: 1.3;
  margin-top: 1px;
}
.tl .t { display: grid; gap: 3px; min-width: 0; }
.tl.nopill { grid-template-columns: 1fr; padding-left: 12px; }
.tl .t b { font-weight: 700; font-size: 1rem; }
.tl .t span { color: var(--testo-2); font-size: .9rem; }
.go {
  justify-self: start; margin-top: 4px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  font-family: var(--f-cartello); font-weight: 700; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
  color: #fff; background: var(--blu); border-radius: 999px; padding: 4px 11px 3px;
}
.go.pin { background: transparent; color: var(--blu); border: 1.5px solid currentColor; }
:root[data-theme="dark"] .go.pin { color: #9DBCF0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .go.pin { color: #9DBCF0; } }

.panel { border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.panel.blu { background: var(--blu); color: #fff; box-shadow: inset 0 0 0 3px var(--blu), inset 0 0 0 5px #fff; padding: 16px 18px; }
.panel.blu h3 { font-family: var(--f-cartello); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: .95rem; }
.panel.blu ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.panel.blu ol li::marker { color: var(--oro); font-weight: 700; }
.panel.blu p { font-size: .88rem; font-style: italic; opacity: .9; }

.linkcard {
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-decoration: none;
  background: var(--card); border: 1.5px solid var(--bordo); border-radius: 12px; padding: 10px 12px;
}
.linkcard b { display: block; }
.linkcard span { font-size: .86rem; color: var(--testo-2); }
.poi {
  width: 44px; height: 44px; border-radius: 8px; background: var(--turistico); display: grid; place-items: center; flex-shrink: 0;
  box-shadow: inset 0 0 0 2px var(--turistico), inset 0 0 0 3.5px #fff;
}
.poi svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.museo { background: var(--card); border: 1.5px solid var(--bordo); border-radius: 12px; overflow: hidden; }
.museo header { background: #3F6F73; color: #fff; padding: 10px 14px; display: grid; gap: 2px; }
.museo header small { font-family: var(--f-cartello); font-weight: 700; font-size: .66rem; letter-spacing: .14em; color: #F3C66A; }
.museo header b { font-family: var(--f-cartello); font-weight: 800; letter-spacing: .2em; font-size: 1.2rem; }
.museo header i { font-size: .86rem; opacity: .9; }
.museo dl { margin: 0; padding: 10px 14px 12px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .9rem; }
.museo dt { font-family: var(--f-cartello); font-weight: 700; font-size: .66rem; letter-spacing: .12em; color: var(--rosso); padding-top: 3px; }
.museo dd { margin: 0; }
.museo .go { margin: 0 14px 14px; }

.motel {
  --m-notte: #1B1626; --m-rosso: #D33A2C; --m-crema: #F6E7BE; --m-giallo: #F5C33B; --m-neon: #FF5A7A; --m-bulb: #FFE9A8;
  position: relative; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; overflow: hidden;
  background: radial-gradient(ellipse at 30% 0%, #3A2D4D, var(--m-notte) 70%); border-radius: 14px; padding: 18px 14px 16px;
}
.motel-v {
  display: grid; gap: 2px; padding: 10px 8px; border-radius: 10px; background: #2A1E1E;
  box-shadow: inset 0 0 0 3px var(--m-rosso), 0 0 14px rgba(211,58,44,.45);
}
.motel-v span {
  font-family: var(--f-titolo); font-weight: 700; font-size: 1.35rem; line-height: 1.05; text-align: center; color: #FFE3E8;
  text-shadow: 0 0 4px var(--m-neon), 0 0 10px var(--m-neon), 0 0 20px var(--m-neon);
}
.motel-s {
  position: relative; padding: 7px; border-radius: 12px 12px 12px 4px; background-color: var(--m-rosso);
  background-image: radial-gradient(circle, var(--m-bulb) 2.2px, rgba(255,233,168,.35) 3.2px, transparent 4px);
  background-size: 13px 13px; background-position: 1px 1px;
  box-shadow: 0 0 16px rgba(255,200,90,.35);
}
.motel-board { background: var(--m-crema); color: #6E1A12; border-radius: 8px; padding: 10px 12px 12px; display: grid; gap: 6px; }
.motel-board b { font-family: var(--f-titolo); font-style: italic; font-size: 1.25rem; line-height: 1.1; }
.motel-board ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; font-family: var(--f-cartello); font-weight: 800; font-size: .74rem; letter-spacing: .1em; color: #2B2019; }
.motel-board li::before { content: "★ "; color: var(--m-rosso); }
.vacancy {
  justify-self: start; margin-top: 4px; background: #1E1A1A; border-radius: 6px; padding: 3px 10px;
  font-family: var(--f-cartello); font-weight: 800; letter-spacing: .14em; font-size: .74rem; color: #FFD9DE;
  text-shadow: 0 0 4px var(--m-neon), 0 0 9px var(--m-neon);
}
.vacancy s { text-decoration: none; opacity: .35; text-shadow: none; color: #9A8E90; }
@media (prefers-reduced-motion: no-preference) {
  .motel-v span { animation: neon 3s infinite; }
  .motel-v span:nth-child(4) { animation: neon-flicker 1.9s infinite; }
  .vacancy s { animation: no-flicker 2.3s infinite; }
  @keyframes neon { 0%, 100% { opacity: 1; } 50% { opacity: .9; } }
  @keyframes neon-flicker { 0%, 60%, 66%, 72%, 100% { opacity: 1; } 63%, 69% { opacity: .2; } }
  @keyframes no-flicker {
    0%, 18%, 100% { opacity: .3; text-shadow: none; color: #9A8E90; }
    20%, 24%, 30%, 52% { opacity: 1; color: #FFD9DE; text-shadow: 0 0 4px var(--m-neon), 0 0 9px var(--m-neon); }
    22%, 27%, 55% { opacity: .3; text-shadow: none; color: #9A8E90; }
  }
}

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager a {
  text-decoration: none; background: var(--card); border: 1.5px solid var(--bordo); border-radius: 12px; padding: 10px 12px;
  display: grid; gap: 2px; font-size: .85rem; color: var(--testo-2); min-width: 0;
}
.pager a b { color: var(--testo); font-size: .95rem; }
.pager a.next { text-align: right; grid-column: 2; }

/* ---------- Guida ---------- */
.tiles { display: grid; gap: 10px; }

/* Mercatini: casette swipeabili */
.towns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.towns button {
  border: 1.5px solid var(--bordo); background: var(--card); border-radius: 999px; padding: 5px 14px; cursor: pointer;
  font-family: var(--f-cartello); font-weight: 700; font-size: .8rem;
}
.towns button[aria-selected="true"] { background: var(--verde); border-color: var(--verde); color: #fff; }
.carousel {
  display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 14px;
  margin-left: calc(-1 * var(--gutter-l)); margin-right: calc(-1 * var(--gutter-r));
  padding: 26px var(--gutter-r) 6px var(--gutter-l); scroll-padding-inline: var(--gutter-l) var(--gutter-r);
  scrollbar-width: none; overscroll-behavior-x: contain;
}
.carousel::-webkit-scrollbar { display: none; }
.casa { flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; display: grid; position: relative; }
.casa-roof { position: relative; height: 64px; }
.casa-roof::before {
  content: ""; position: absolute; inset: 0; background: var(--tetto);
  clip-path: polygon(50% 0, 100% 78%, 100% 100%, 0 100%, 0 78%);
}
.casa-roof::after {
  content: ""; position: absolute; inset: 0; background: var(--neve);
  clip-path: polygon(50% 0, 100% 78%, 100% 90%, 96% 84%, 92% 88%, 50% 12%, 8% 88%, 4% 84%, 0 90%, 0 78%);
}
.lights { display: flex; justify-content: space-around; padding: 0 10px; height: 12px; background: var(--legno-2); }
.lights i { width: 7px; height: 10px; border-radius: 50% 50% 45% 45%; display: block; margin-top: 1px; }
.casa-body {
  background: repeating-linear-gradient(90deg, var(--legno) 0 26px, var(--legno-2) 26px 28px);
  padding: 12px 12px 14px; display: grid; gap: 12px;
}
.casa-sign {
  justify-self: center; display: inline-flex; align-items: center; gap: 8px; border-radius: 6px; padding: 6px 18px;
  font-family: var(--f-titolo); font-weight: 700; font-size: 1.25rem; color: #fff; box-shadow: 0 0 0 3px #2B2019;
}
.casa-panel {
  background: var(--card); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px;
  outline: 1.5px dashed var(--rosso); outline-offset: -6px; align-content: start;
}
.casa-panel .when { font-style: italic; color: var(--rosso); font-size: .88rem; }
.mkt { display: grid; gap: 2px; text-decoration: none; padding: 6px 8px; margin-inline: -8px; border-radius: 8px; }
.mkt:active, .mkt:hover { background: var(--carta-2); }
.mkt b { font-size: 1.02rem; display: flex; justify-content: space-between; gap: 8px; }
.mkt b::after { content: ""; width: 9px; height: 9px; flex-shrink: 0; margin: 5px 3px 0 0; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--rosso); box-shadow: inset 0 0 0 2.5px var(--rosso), inset 0 0 0 5px var(--card); }
.mkt span { font-size: .88rem; color: var(--testo-2); }
.counter { height: 16px; background: var(--tetto); border-radius: 0 0 4px 4px; display: flex; justify-content: space-around; align-items: end; padding: 0 12px; }
.counter i { width: 9px; height: 10px; border-radius: 1px 1px 3px 3px; margin-bottom: 3px; display: block; }
.snow { height: 12px; background: var(--neve); border-radius: 0 0 8px 8px; opacity: .9; }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--bordo); display: block; transition: background .2s, transform .2s; }
.dots i.on { background: var(--verde); transform: scale(1.3); }
.swipe-hint { text-align: center; font-size: .82rem; color: var(--testo-2); }

/* Mangiare vegano */
.vegan { background: var(--blu); color: #fff; border-radius: 14px; padding: 16px 14px 14px; box-shadow: inset 0 0 0 3px var(--blu), inset 0 0 0 5px #fff; display: grid; gap: 14px; }
.vegan h3 { font-family: var(--f-cartello); font-weight: 800; letter-spacing: .12em; font-size: 1rem; display: flex; gap: 10px; align-items: center; padding-inline: 4px; }
.vegan h3 svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; }
.vgroup { background: var(--card); color: var(--testo); border-radius: 10px; padding: 8px; display: grid; gap: 4px; }
.vgroup .label { padding: 4px 6px 2px; }
.vitem { display: grid; gap: 1px; text-decoration: none; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--bordo); }
.vitem:active, .vitem:hover { background: var(--carta-2); }
.vitem b { display: flex; justify-content: space-between; gap: 8px; }
.vitem b::after { content: ""; width: 9px; height: 9px; flex-shrink: 0; margin: 5px 3px 0 0; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--rosso); box-shadow: inset 0 0 0 2.5px var(--rosso), inset 0 0 0 5px var(--card); }
.vitem span { font-size: .86rem; color: var(--testo-2); }
.tel { font-size: .86rem; color: var(--rosso); }
.fonti { font-size: .78rem; opacity: .85; padding-inline: 4px; }
.fonti a { color: inherit; }

/* Racchette */
.board {
  background: repeating-linear-gradient(180deg, var(--legno-2) 0 34px, var(--tetto) 34px 36px);
  border-radius: 6px; padding: 14px; color: #F7EBDD; display: grid; gap: 10px; position: relative; margin-top: 24px;
}
.board::before {
  content: ""; position: absolute; left: -8px; right: -8px; top: -22px; height: 24px; background: #A79A8E;
  clip-path: polygon(6% 100%, 50% 0, 94% 100%);
}
.board h3 { font-family: var(--f-cartello); font-weight: 800; font-size: 1rem; }
.trail { display: grid; grid-template-columns: 24px 1fr; gap: 10px; text-decoration: none; padding: 6px; border-radius: 8px; }
.trail:hover, .trail:active { background: rgba(255,255,255,.08); }
.trail b { font-family: var(--f-cartello); font-weight: 700; font-size: .95rem; color: #fff; }
.trail span { font-size: .84rem; opacity: .9; display: block; }
.diff { width: 18px; height: 18px; margin-top: 2px; display: block; }
.diff.facile { border-radius: 50%; background: #1C7A55; border: 2px solid #fff; }
.diff.medio { background: #1F4E8C; border: 2px solid #fff; }
.diff.nd { border-radius: 50%; border: 2px dashed #fff; }
.board .fonti { color: #E9DCCB; }

/* Scontrino */
.receipt {
  background: var(--carta-scontrino); color: var(--ink-scontrino); font-family: var(--f-cassa);
  padding: 22px 18px; position: relative; display: grid; gap: 10px; margin-block: 8px;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.18));
}
.receipt::before, .receipt::after {
  content: ""; position: absolute; left: 0; right: 0; height: 8px;
  background: linear-gradient(-45deg, var(--carta-scontrino) 5.6px, transparent 0), linear-gradient(45deg, var(--carta-scontrino) 5.6px, transparent 0);
  background-size: 12px 12px;
}
.receipt::before { top: -8px; background-position: left bottom; }
.receipt::after { bottom: -8px; transform: rotate(180deg); }
.receipt h3 { text-align: center; font-family: var(--f-cassa); letter-spacing: .14em; font-size: 1.05rem; }
.receipt .sub { text-align: center; font-size: .78rem; }
.receipt hr { border: 0; border-top: 1.5px dashed var(--ink-scontrino); margin: 2px 0; width: 100%; }
.receipt hr.d { border-top-style: double; border-top-width: 4px; }
.r-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-variant-numeric: tabular-nums; }
.r-row b { font-size: 1rem; }
.r-row small { grid-column: 1; font-size: .78rem; opacity: .8; }
.r-row .v { grid-row: 1; grid-column: 2; font-weight: 700; }
.r-tot { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.3rem; }
.r-tot .v { color: var(--rosso); }
.r-small { display: flex; justify-content: space-between; font-size: .88rem; font-weight: 700; }
.thanks { text-align: center; font-size: .8rem; }
.r-row small { line-height: 1.9; }
.num-in {
  font: inherit; font-weight: 700; color: inherit; background: transparent; text-align: right;
  border: 0; border-bottom: 1.5px dashed var(--rosso); border-radius: 0; padding: 0 1px; margin: 0;
  width: calc(var(--w, 4) * 1ch + 4px); min-width: 2.5ch; font-variant-numeric: tabular-nums;
}
.num-in::placeholder { color: inherit; opacity: .35; }
.num-in:focus { outline: none; background: rgba(226,169,59,.25); border-bottom-style: solid; }
.r-row small .num-in { font-weight: 700; font-size: .9rem; }
.r-row .v .num-in { font-size: 1rem; }
.r-reset { justify-self: center; background: none; border: 0; cursor: pointer; font: 700 .78rem var(--f-cassa); color: var(--rosso); text-decoration: underline; padding: 4px; }

/* ---------- Rubrica ---------- */
.nb { background: var(--nb-copertina); border-radius: 14px; padding: 22px 38px 14px 12px; position: relative; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
.nb-rings {
  position: absolute; left: 26px; right: 50px; top: 6px; height: 26px; z-index: 2; pointer-events: none;
  background: radial-gradient(ellipse 4px 11px at 50% 50%, transparent 2.6px, #6E6E78 3px, #D3D3DA 4px, transparent 4.6px) 0 0 / 20px 26px repeat-x;
}
.nb-page {
  background-color: var(--nb-carta);
  background-image:
    linear-gradient(90deg, transparent 38px, var(--nb-margine) 38px, var(--nb-margine) 39.5px, transparent 39.5px),
    repeating-linear-gradient(180deg, transparent 0 27px, var(--nb-riga) 27px 28px);
  background-position: 0 6px;
  border-radius: 6px; padding: 34px 12px 28px 50px; color: var(--nb-ink);
  font-family: var(--f-mano); font-size: 1.16rem; line-height: 28px; min-height: 60vh;
}
.nb-sec { position: relative; padding-top: 28px; scroll-margin-top: 16px; }
.nb-sec:first-child { padding-top: 0; }
.nb-sec h2 {
  font-family: var(--f-mano); font-weight: 400; font-size: 1.45rem; line-height: 28px; display: inline-block;
  border-bottom: 2px solid var(--nb-ink); padding-right: 10px; margin-bottom: 0; border-radius: 0 0 40% 0 / 0 0 4px 0;
}
.nb-sec h3 { font-family: var(--f-mano); font-weight: 400; font-size: 1.05rem; line-height: 28px; color: var(--rosso); letter-spacing: .06em; margin-top: 0; }
.nb-e + h3 { margin-top: 28px; }
.nb-e { display: grid; padding-right: 4px; }
.nb-e .n { text-transform: uppercase; justify-self: start; padding-inline: 2px; background: linear-gradient(transparent 52%, rgba(242,194,48,.5) 52%, rgba(242,194,48,.5) 88%, transparent 88%); }
.nb-e a { text-decoration: none; display: block; width: fit-content; max-width: 100%; border-bottom: 1.5px dashed var(--nb-ink); line-height: 26px; margin-bottom: 2px; }
.nb-e a::after { content: " ↗"; font-size: .95rem; }
.nb-e .i { color: #4A5E91; }
.nb-tabs { position: absolute; right: 4px; top: 30px; display: grid; gap: 5px; z-index: 3; }
.nb-tabs { justify-items: end; }
.nb-tabs button {
  width: 32px; padding: 9px 0; border: 0; border-radius: 0 7px 7px 0; text-align: center; cursor: pointer;
  font-family: var(--f-cartello); font-weight: 800; font-size: .66rem; color: #2B2019; letter-spacing: .02em;
  box-shadow: inset 2px 0 0 rgba(0,0,0,.12); transition: width .15s;
}
.nb-tabs button[data-rb=""] { font-size: .6rem; letter-spacing: 0; }
.nb-tabs button[aria-pressed="true"] { width: 38px; margin-right: -6px; box-shadow: inset 2px 0 0 rgba(0,0,0,.12), 0 0 0 2px #2B2019; }
.nb-pen { display: block; width: 150px; height: 26px; margin: 10px 0 0 auto; }
.nb-note { font-size: .84rem; color: var(--testo-2); }

/* ---------- Prossima tappa (home, solo nei giorni del viaggio) ---------- */
.nextstop {
  position: relative; margin-top: 30px; background: var(--verde); color: #fff; border-radius: 14px;
  box-shadow: inset 0 0 0 3px var(--verde), inset 0 0 0 5.5px #fff; padding: 18px 18px 14px; display: grid; gap: 10px;
}
.nextstop h2 { font-family: var(--f-cartello); font-weight: 800; font-size: 1.55rem; line-height: 1.1; }
.nextstop .where { font-size: .98rem; }
.nextstop .note { font-size: .88rem; color: #CFE8DC; }
.prog { display: flex; gap: 5px; }
.prog i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.28); display: block; }
.prog i.done { background: var(--oro); }
.prog i.cur { background: #fff; }
.navgo {
  display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; cursor: pointer;
  background: #fff; color: #0F6B4C; border: 0; border-radius: 10px; padding: 13px 12px;
  font-family: var(--f-cartello); font-weight: 800; font-size: 1.02rem; letter-spacing: .04em; text-transform: uppercase;
}
.nextstop .row { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; }
.linkbtn {
  background: none; border: 0; padding: 4px 0; cursor: pointer; color: #fff; text-decoration: underline; text-underline-offset: 3px;
  font-family: var(--f-cartello); font-weight: 700; font-size: .8rem;
}
.geo { font-size: .78rem; color: #CFE8DC; }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
  background: var(--marrone); color: var(--su-marrone); border-radius: 10px; padding: 10px 16px; font-size: .9rem;
  width: max-content; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Radio ---------- */
.radio-wrap { margin-left: calc(6px - var(--gutter-l)); margin-right: calc(6px - var(--gutter-r)); }
.radio { width: 100%; height: auto; display: block; filter: drop-shadow(0 6px 6px rgba(0,0,0,.25)); }
.radio text { font-family: var(--f-cartello); }
.radio .lcd-txt, .radio .lcd-glow, .radio .eq, .radio .led-on, .radio .pon { opacity: 0; transition: opacity .35s; }
.radio.on .lcd-txt, .radio.on .lcd-glow, .radio.on .eq, .radio.on .led-on, .radio.on .preset.sel .pon { opacity: 1; }
.radio.on .preset[data-st] { cursor: pointer; }
.radio .preset:active rect.base { transform: translateY(1px); }
.radio .sticker { cursor: pointer; }
.radio .sticker:focus { outline: none; }
.radio .knob-rot { transition: transform .5s cubic-bezier(.3,1.4,.5,1); transform-box: view-box; transform-origin: 92px 112px; transform: rotate(-120deg); }
.radio.on .knob-rot { transform: rotate(40deg); }
.radio .pwr { cursor: pointer; }
.radio .pwr:focus { outline: none; }
.radio .pwr:focus-visible circle.ring { stroke: var(--oro); stroke-width: 3; }
.radio .eq rect { transform-box: fill-box; transform-origin: 50% 100%; }
@media (prefers-reduced-motion: no-preference) {
  .radio.on .eq rect { animation: eq .7s ease-in-out infinite alternate; }
  .radio.on .eq rect:nth-child(2n) { animation-duration: .55s; }
  .radio.on .eq rect:nth-child(3n) { animation-duration: .9s; animation-delay: -.3s; }
  .radio.on .eq rect:nth-child(5n) { animation-duration: .45s; animation-delay: -.2s; }
}
@keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
@media (prefers-reduced-motion: no-preference) {
  .radio.tuning .lcd-txt { animation: tuning .9s steps(2, start) infinite; }
  .radio.tuning .eq rect { animation-play-state: paused; }
}
@keyframes tuning { to { opacity: .25; } }
.onair {
  background: var(--marrone); color: var(--su-marrone); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center;
}
.onair-btn {
  border: 0; cursor: pointer; border-radius: 8px; padding: 12px 12px; background: #5A2A22; color: #C9928A;
  font-family: var(--f-cartello); font-weight: 800; letter-spacing: .14em; font-size: .9rem;
  box-shadow: inset 0 0 0 3px #3A1A15, 0 0 0 3px #8A5A40; transition: background .25s, color .25s, box-shadow .25s;
}
.onair-btn[aria-pressed="true"] { background: #D23B2B; color: #fff; box-shadow: inset 0 0 0 3px #A52A1E, 0 0 0 3px #8A5A40, 0 0 18px rgba(255,80,60,.7); }
.onair .t { display: grid; gap: 3px; min-width: 0; font-size: .86rem; }
.onair .t b { font-family: var(--f-cartello); font-weight: 800; letter-spacing: .12em; color: var(--etichetta); font-size: .78rem; }
.onair .t i { font-style: italic; }
.onair .t a { color: inherit; font-weight: 700; }

/* ---------- Home ---------- */
.sign.has-tab { margin-top: 30px; }
.gear { position: absolute; top: 12px; right: var(--gutter-r); z-index: 2; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.12); color: #F3E9D6; }
.gear svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.minilegs { display: grid; background: var(--card); border: 1.5px solid var(--bordo); border-radius: 12px; overflow: hidden; }
.minilegs a { display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: center; padding: 9px 12px; text-decoration: none; }
.minilegs a + a { border-top: 1px solid var(--bordo); }
.minilegs .d { font-family: var(--f-cartello); font-weight: 800; font-size: .74rem; letter-spacing: .06em; color: var(--rosso); white-space: nowrap; }
.minilegs .r { font-weight: 600; font-size: .9rem; min-width: 0; }

/* ---------- Impostazioni · officina ---------- */
.officina {
  --acciaio-1: #DDE1E6; --acciaio-2: #9AA1A9; --ferro: #3A3F45; --giallo: #F2C230; --nero: #1B1B1B;
  margin-left: calc(-1 * var(--gutter-l) + 6px); margin-right: calc(-1 * var(--gutter-r) + 6px);
  border-radius: 12px; padding: 14px 12px 20px; display: grid; gap: 14px;
  background-color: #8A6845;
  background-image: radial-gradient(circle, #3B2817 1.7px, transparent 2.2px), linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.1));
  background-size: 18px 18px, 100% 100%;
  box-shadow: inset 0 0 0 2px #5C4329, inset 0 0 30px rgba(0,0,0,.25);
}
.rivet { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #F4F6F8, #7E858D 70%); box-shadow: 0 1px 1px rgba(0,0,0,.5); }
.rivet.rv-tl { top: 7px; left: 7px; } .rivet.rv-tr { top: 7px; right: 7px; } .rivet.rv-bl { bottom: 7px; left: 7px; } .rivet.rv-br { bottom: 7px; right: 7px; }
.garage {
  position: relative; display: grid; justify-items: center; gap: 2px; padding: 16px 18px 14px; border-radius: 14px;
  background: #F3E6C8; color: #5A2E14; border: 3px solid #5A2E14;
  box-shadow: inset 0 0 0 3px #F3E6C8, inset 0 0 0 5px #C9562A, 0 4px 0 rgba(0,0,0,.35);
  background-image: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.35), transparent 60%), linear-gradient(180deg, transparent 70%, rgba(90,46,20,.08));
}
.g-nome { font-family: var(--f-titolo); font-style: italic; font-weight: 700; font-size: 1.5rem; line-height: 1; color: #C9562A; text-shadow: 1px 1px 0 #5A2E14; transform: rotate(-4deg); }
.g-mid { display: flex; align-items: center; justify-content: center; gap: 8px; }
.g-wr { width: 30px; height: 30px; flex-shrink: 0; fill: #5A2E14; }
.garage h1 {
  font-family: var(--f-cartello); font-weight: 800; font-size: 1.75rem; line-height: 1; letter-spacing: .12em; text-transform: uppercase; text-align: center;
  color: #5A2E14; text-shadow: 2px 2px 0 #E9B43A;
}
.g-righe { display: grid; gap: 3px; width: 100%; margin: 4px 0 2px; }
.g-righe i { display: block; height: 4px; border-radius: 2px; }
.g-righe i:nth-child(1) { background: #E8762B; } .g-righe i:nth-child(2) { background: #E9B43A; } .g-righe i:nth-child(3) { background: #8A4A22; }
.g-sub { font-family: var(--f-cartello); font-weight: 800; font-size: .74rem; letter-spacing: .18em; text-transform: uppercase; color: #5A2E14; text-align: center; }
.g-since { margin-top: 4px; font-family: var(--f-titolo); font-style: italic; font-weight: 700; font-size: .8rem; color: #F3E6C8; background: #C9562A; border-radius: 999px; padding: 1px 12px; }
.hazard { height: 12px; border-radius: 3px; margin-top: -4px; background: repeating-linear-gradient(-45deg, var(--giallo) 0 11px, var(--nero) 11px 22px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
.drawer {
  position: relative; border-radius: 8px; padding: 16px 14px 18px; display: grid; gap: 10px; border: 2px solid #6E757D;
  background-color: #AEB4BB;
  background-image:
    linear-gradient(135deg, transparent 42%, rgba(255,255,255,.45) 42% 58%, transparent 58%),
    linear-gradient(45deg, transparent 42%, rgba(0,0,0,.12) 42% 58%, transparent 58%);
  background-size: 16px 16px, 16px 16px; background-position: 0 0, 8px 8px;
  box-shadow: 0 3px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.5);
}
.dymo {
  justify-self: start; color: #F4F4F4; border-radius: 3px; padding: 3px 12px 2px; transform: rotate(-1.2deg);
  font-family: var(--f-cartello); font-weight: 800; font-size: .78rem; letter-spacing: .2em;
  text-shadow: 0 1px 0 rgba(0,0,0,.6), 0 -1px 0 rgba(255,255,255,.25); box-shadow: 0 1px 2px rgba(0,0,0,.4);
}
.drawer-in { display: grid; gap: 8px; background: rgba(255,255,255,.72); border-radius: 6px; padding: 10px; color: #23272C; font-size: .9rem; }
.officina .seg { background: #2B2E33; border-radius: 8px; padding: 4px; gap: 4px; }
.officina .seg button {
  background: linear-gradient(#61666D, #3E4248); color: #D8DBDF; border-radius: 6px; padding: 9px 2px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 0 rgba(0,0,0,.5);
}
.officina .seg button[aria-pressed="true"] { background: linear-gradient(#F7D25A, #D99E15); color: #1B1B1B; box-shadow: inset 0 2px 4px rgba(0,0,0,.35); }
.officina .btn { background: var(--nero); }
.bolla {
  position: relative; background: #FFFDF4; color: #2B2019; border-radius: 4px; padding: 26px 16px 14px; display: grid; gap: 8px;
  font-family: var(--f-cassa); font-size: .86rem; box-shadow: 0 3px 6px rgba(0,0,0,.3); transform: rotate(.6deg); margin-top: 8px;
  background-image: repeating-linear-gradient(180deg, transparent 0 21px, rgba(31,78,140,.12) 21px 22px);
}
.bolla .clip { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 90px; height: 24px; border-radius: 5px;
  background: linear-gradient(#E3E6EA, #8D949C); border: 1.5px solid #5B6168; }
.bolla-h { font-weight: 700; letter-spacing: .12em; border-bottom: 1.5px dashed #2B2019; padding-bottom: 4px; }
.bolla .firma { font-style: italic; opacity: .75; text-align: right; }
.stopbtn { display: grid; justify-items: center; gap: 8px; margin-top: 4px; }
.emergenza {
  width: 78px; height: 78px; border-radius: 50%; cursor: pointer; border: 7px solid var(--giallo);
  background: radial-gradient(circle at 38% 32%, #FF7A6B, #C42A1C 55%, #7D1610);
  box-shadow: 0 0 0 3px var(--nero), 0 5px 0 #5A0F09, 0 8px 10px rgba(0,0,0,.4); transition: transform .08s, box-shadow .08s;
}
.emergenza:active { transform: translateY(4px); box-shadow: 0 0 0 3px var(--nero), 0 1px 0 #5A0F09, 0 3px 5px rgba(0,0,0,.4); }
.stopbtn span { font-family: var(--f-cartello); font-weight: 800; letter-spacing: .2em; font-size: .78rem; color: #F4F4F4; background: var(--nero); padding: 3px 10px; border-radius: 3px; }

/* ---------- Banner di installazione ---------- */
#instbox:empty { display: none; }
.instbar {
  display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center;
  background: var(--marrone); color: var(--su-marrone); border-radius: 14px; padding: 12px;
  box-shadow: inset 0 0 0 2px var(--oro);
}
.instbar img { width: 48px; height: 48px; border-radius: 11px; display: block; }
.instbar-t { display: grid; gap: 2px; min-width: 0; font-size: .86rem; }
.instbar-t b { font-family: var(--f-cartello); font-weight: 800; font-size: .98rem; color: var(--etichetta); }
.instbar-b { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; }
.instbar .btn { background: var(--oro); color: #2B2019; }
.linkbtn2 { background: none; border: 0; padding: 6px 2px; cursor: pointer; color: var(--su-marrone); opacity: .8; text-decoration: underline; font-family: var(--f-cartello); font-weight: 700; font-size: .85rem; }

/* ---------- Stazioni ---------- */
.stations { background: var(--marrone); color: var(--su-marrone); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.stations-head { display: flex; align-items: center; gap: 12px; }
.stations-head b { font-family: var(--f-cartello); font-weight: 800; letter-spacing: .14em; font-size: .8rem; color: var(--etichetta); }
.st-row {
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; text-align: left; cursor: pointer;
  background: rgba(255,255,255,.05); border: 0; border-radius: 10px; padding: 7px 10px 7px 7px; color: inherit; font: inherit;
}
.st-row:disabled { cursor: default; }
.st-key {
  width: 54px; height: 46px; border-radius: 8px; display: grid; place-items: center; transition: background .2s, box-shadow .2s, opacity .2s;
  border: 2px solid #2A2C30; background: linear-gradient(#5E6268, #3E4248); color: #E6E6E6;
  font-family: var(--f-cartello); font-weight: 800; font-size: 1.35rem;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 3px 0 #1A1B1D;
}

function meters(a, b) {
  var R = 6371000, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return 2 * R * Math.asin(Math.sqrt(h));
}

  if (meters([pos.coords.latitude, pos.coords.longitude], st.ll || PRIV[st.llKey + "_LL"]) <= st.r) {
    navState.i++; navState.started = false; saveNav();
    var nx = plan[navState.i];
    toast("Arrivati: " + st.name + (nx ? ". Prossima tappa: " + nx.name : ". Tappe di oggi finite."));
    renderNavCard();
  }
}
function startGeo(ask) {
  if (geoWatch !== null || !("geolocation" in navigator)) return;
  function go() {
    try {

    } catch (e) { geoWatch = null; }
  }
  if (ask) return go();
  // senza tocco dell'utente: parte solo se il permesso è già stato dato
  try {
    navigator.permissions.query({ name: "geolocation" }).then(function (p) { if (p.state === "granted") go(); }).catch(function () {});
  } catch (e) {}
}

function initMap(sel) {
  var svg = document.getElementById("map");
  if (!svg) return;
  if (sel) {
    svg.classList.add("focus");
    svg.querySelectorAll('.leg-g[data-leg="' + sel + '"]').forEach(function (g) { g.classList.add("sel"); });
  }
  var vb = { x: BASE.x, y: BASE.y, w: BASE.w, h: BASE.h };
  var MINW = BASE.w / 5;

  function apply() {
    svg.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h);
    svg.classList.toggle("zoomed", BASE.w / vb.w > 1.45);
  }
  function clamp() {
    vb.x = Math.min(Math.max(vb.x, BASE.x - vb.w * 0.4), BASE.x + BASE.w - vb.w * 0.6);
    vb.y = Math.min(Math.max(vb.y, BASE.y - vb.h * 0.4), BASE.y + BASE.h - vb.h * 0.6);
  }
  function toSvg(cx, cy) {
    var pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function zoomAt(f, sx, sy) {
    var nw = Math.min(BASE.w, Math.max(MINW, vb.w / f)), k = nw / vb.w;
    vb.x = sx - (sx - vb.x) * k; vb.y = sy - (sy - vb.y) * k;
    vb.w = nw; vb.h = nw * BASE.h / BASE.w;
    clamp(); apply();
  }
  function zoomCenter(f) { zoomAt(f, vb.x + vb.w / 2, vb.y + vb.h / 2); }

  document.getElementById("zin").onclick = function () { zoomCenter(1.5); };
  document.getElementById("zout").onclick = function () { zoomCenter(1 / 1.5); };
  document.getElementById("zreset").onclick = function () { vb = { x: BASE.x, y: BASE.y, w: BASE.w, h: BASE.h }; apply(); };

  function goLeg(target) {
    var g = target && target.closest && target.closest(".leg-g");
    if (g) location.hash = "leg-" + g.getAttribute("data-leg");
  }

  /* Telefono: un dito scorre la pagina (e tocca le leg), due dita spostano e ingrandiscono la mappa. */
  var hint = document.createElement("div");
  hint.className = "map-2dita"; hint.textContent = "Usa due dita per muovere la mappa";
  svg.parentNode.appendChild(hint);
  var hintTm, pinch = null, oneStart = null;
  function showHint() { hint.classList.add("show"); clearTimeout(hintTm); hintTm = setTimeout(function () { hint.classList.remove("show"); }, 1300); }
  function two(t) {
    return { d: Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY), mx: (t[0].clientX + t[1].clientX) / 2, my: (t[0].clientY + t[1].clientY) / 2 };
  }
  svg.addEventListener("touchstart", function (e) {
    if (e.touches.length === 2) { e.preventDefault(); pinch = two(e.touches); oneStart = null; hint.classList.remove("show"); }
    else if (e.touches.length === 1) { oneStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, warned: false }; }
  }, { passive: false });
  svg.addEventListener("touchmove", function (e) {
    if (e.touches.length === 2 && pinch) {
      e.preventDefault();
      var n = two(e.touches), scale = svg.getScreenCTM().a;
      vb.x -= (n.mx - pinch.mx) / scale; vb.y -= (n.my - pinch.my) / scale;
      var p = toSvg(n.mx, n.my);
      zoomAt(n.d / pinch.d, p.x, p.y);
      pinch = n;
    } else if (e.touches.length === 1 && oneStart && !oneStart.warned) {
      // un dito che si muove soprattutto in orizzontale: ricorda di usarne due
      var dx = Math.abs(e.touches[0].clientX - oneStart.x), dy = Math.abs(e.touches[0].clientY - oneStart.y);
      if (dx > 24 && dx > dy * 1.5) { oneStart.warned = true; showHint(); }
    }
  }, { passive: false });
  svg.addEventListener("touchend", function (e) { if (e.touches.length < 2) pinch = null; });
  svg.addEventListener("touchcancel", function () { pinch = null; });

  /* Computer: trascina con il mouse. */
  var drag = null, moved = false;
  svg.addEventListener("pointerdown", function (e) {
    if (e.pointerType !== "mouse") return;
    drag = { x: e.clientX, y: e.clientY }; moved = false;
    try { svg.setPointerCapture(e.pointerId); } catch (er) {}
  });
  svg.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerType !== "mouse") return;
    if (!moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) { moved = true; svg.classList.add("dragging"); }
    if (moved) {
      var scale = svg.getScreenCTM().a;
      vb.x -= (e.clientX - drag.x) / scale; vb.y -= (e.clientY - drag.y) / scale;
      drag = { x: e.clientX, y: e.clientY };
      clamp(); apply();
    }
  });
  function endDrag() { drag = null; svg.classList.remove("dragging"); }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);

  /* Tocco o clic su una leg: la apre (non dopo un trascinamento). */
  svg.addEventListener("click", function (e) {
    if (moved) { moved = false; return; }
    goLeg(e.target);
  });
  svg.addEventListener("wheel", function (e) {
    e.preventDefault();
    var p = toSvg(e.clientX, e.clientY);
    zoomAt(Math.pow(1.0018, -e.deltaY), p.x, p.y);
  }, { passive: false });
  if (sel) {
    // inquadra la leg scelta
    var box = null;
    svg.querySelectorAll('.leg-g[data-leg="' + sel + '"]').forEach(function (g) {
      var b = g.getBBox();
      box = box ? { x1: Math.min(box.x1, b.x), y1: Math.min(box.y1, b.y), x2: Math.max(box.x2, b.x + b.width), y2: Math.max(box.y2, b.y + b.height) }
                : { x1: b.x, y1: b.y, x2: b.x + b.width, y2: b.y + b.height };
    });
    if (box) {
      var w = Math.max(box.x2 - box.x1 + 90, BASE.w / 3.2), h = box.y2 - box.y1 + 130;
      if (h > w * BASE.h / BASE.w) w = h * BASE.w / BASE.h;
      w = Math.min(w, BASE.w);
      vb.w = w; vb.h = w * BASE.h / BASE.w;
      vb.x = (box.x1 + box.x2) / 2 - vb.w / 2; vb.y = (box.y1 + box.y2) / 2 - vb.h / 2 + 22;
      clamp();
    }
  }
  apply();
}

/* Budget condiviso: budget.json nel repo privato. Ogni modifica parte dopo 1,5 s; ogni 20 s
   (e quando riapri l'app) si scaricano le modifiche dell'altro telefono. Senza rete restano in coda. */
var BKEYS = ["sion", "berna", "cibo", "litri", "prezzo", "furka", "bus", "extra", "manPrezzo"];
var bsync = { sha: null, dirty: {}, status: "", at: null, busy: false, again: false, tm: null };
try { bsync.dirty = JSON.parse(localStorage.getItem("rta-bdirty") || "{}"); } catch (e) {}
function saveDirty() { try { localStorage.setItem("rta-bdirty", JSON.stringify(bsync.dirty)); } catch (e) {} }
function syncText() {
  if (!ghKey()) return "Solo su questo telefono";
  if (bsync.status === "sending") return "Invio…";
  if (bsync.status === "offline") return "In attesa di rete";
  if (bsync.status === "error") return "Chiave non valida";
  if (bsync.status === "ok" && bsync.at) return "Condiviso · " + bsync.at.toTimeString().slice(0, 5);
  return "Condiviso";
}
function setSync(st) { bsync.status = st; if (st === "ok") bsync.at = new Date(); var el = document.getElementById("b-sync"); if (el) el.textContent = syncText(); }
function markDirty(k) {
  bsync.dirty[k] = 1; saveDirty();
  clearTimeout(bsync.tm); bsync.tm = setTimeout(pushBudget, 1500);
}
function applyRemoteBudget(v) {
  var changed = false;
  BKEYS.forEach(function (k) {
    if (bsync.dirty[k] || !(k in v)) return;
    // solo numeri (e un sì/no): niente testo dal repo finisce nella pagina
    var nv = k === "manPrezzo" ? v[k] === true : Number(v[k]);
    if (k !== "manPrezzo" && !isFinite(nv)) return;
    if (budget[k] !== nv) { budget[k] = nv; changed = true; }
  });
  if (!budget.manPrezzo && budget.prezzo !== BUDGET_DEF.prezzo) { budget.prezzo = BUDGET_DEF.prezzo; changed = true; }   // prezzo automatico TCS
  if (changed) saveBudget();
  return changed;
}
function pullBudget() {
  if (!ghKey() || bsync.busy) return Promise.resolve();
  return ghGet("budget.json").then(function (res) {
    if (res) {
      bsync.sha = res.sha;
      var changed = applyRemoteBudget(res.data.values || {});
      var h = (location.hash || "#home").slice(1), typing = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains("num-in");
      if (changed && !typing && /^(guida|guida-budget|home)$/.test(h)) render();
    }
    if (Object.keys(bsync.dirty).length) return pushBudget();
    setSync("ok");
  }).catch(function () { setSync(navigator.onLine === false ? "offline" : "error"); });
}
function pushBudget() {
  if (!ghKey() || !Object.keys(bsync.dirty).length) return Promise.resolve();
  if (bsync.busy) { bsync.again = true; return Promise.resolve(); }
  bsync.busy = true; setSync("sending");
  var sent = Object.assign({}, bsync.dirty), tries = 0;
  function attempt() {
    return ghGet("budget.json").then(function (res) {
      var merged = Object.assign({}, res && res.data.values || {});
      Object.keys(sent).forEach(function (k) { merged[k] = budget[k]; });
      return ghPut("budget.json", { values: merged, updated: new Date().toISOString() }, res && res.sha, "Budget aggiornato dall'app");
    }).catch(function (err) { if ((err === 409 || err === 422) && ++tries < 3) return attempt(); throw err; });
  }
  return attempt().then(function (sha) {
    bsync.sha = sha;
    Object.keys(sent).forEach(function (k) { delete bsync.dirty[k]; }); saveDirty();
    setSync("ok");
  }).catch(function () { setSync(navigator.onLine === false ? "offline" : "error"); })
    .then(function () { bsync.busy = false; if (bsync.again) { bsync.again = false; pushBudget(); } });
}
setInterval(function () { if (!document.hidden && ghKey() && (location.hash === "#guida-budget" || Object.keys(bsync.dirty).length)) pullBudget(); }, 20000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) pullBudget(); });
window.addEventListener("online", function () { pullBudget(); });

function updateBudgetTotals() {
  var l = budgetLines(), t = budgetTotal();
  document.getElementById("b-alloggio").textContent = chf(l.alloggio);
  document.getElementById("b-benzina").textContent = chf(l.benzina);
  document.getElementById("b-trasporti").textContent = chf(l.trasporti);
  document.getElementById("b-tot").textContent = "≈ " + chf(t);
  document.getElementById("b-pp").textContent = chf(t / 2);
  document.getElementById("b-pg").textContent = chf(t / 12);
  var nota = "";
  if (budget.manPrezzo) nota += "Prezzo a mano." + (tcs ? ' <button type="button" class="r-reset" id="b-tcs">Usa il prezzo TCS (' + tcs.bleifrei95.toFixed(2) + ')</button>' : "");
  else nota += "TCS, " + (tcs ? dataIt(tcs.data) : "18.11.2026");
  var el = document.getElementById("b-nota");
  el.innerHTML = nota;
  var bt = document.getElementById("b-tcs");
  if (bt) bt.onclick = function () { budget.manPrezzo = false; budget.prezzo = tcs.bleifrei95; saveBudget(); markDirty("manPrezzo"); render(); };
}
function initBudget() {
  updateBudgetTotals();
  setSync(bsync.status);
  pullBudget();
  document.querySelectorAll(".num-in").forEach(function (inp) {
    // al tocco il campo si svuota (la cifra vecchia resta in grigio); se non scrivi niente torna com'era
    inp.addEventListener("focus", function () { inp.placeholder = inp.value; inp.value = ""; });
    inp.addEventListener("input", function () {
      var clean = inp.value.replace(/,/g, ".").replace(/[^0-9.]/g, "").replace(/(\..*)\./g, "$1");
      if (clean !== inp.value) inp.value = clean;
      inp.style.setProperty("--w", Math.max(inp.value.length, 1));
      if (clean === "" || clean === ".") return;   // campo appena svuotato: il totale resta quello di prima
      var v = parseFloat(clean);
      budget[inp.getAttribute("data-k")] = isNaN(v) ? 0 : v;
      markDirty(inp.getAttribute("data-k"));
      if (inp.getAttribute("data-k") === "prezzo") { budget.manPrezzo = true; markDirty("manPrezzo"); }
      saveBudget(); updateBudgetTotals();
    });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") inp.blur(); });
    inp.addEventListener("blur", function () {
      if (inp.value === "" || inp.value === ".") {
        inp.value = inp.placeholder || "0";
        var v = parseFloat(inp.value); budget[inp.getAttribute("data-k")] = isNaN(v) ? 0 : v; markDirty(inp.getAttribute("data-k"));
        saveBudget(); updateBudgetTotals();
      }
      inp.style.setProperty("--w", Math.max(inp.value.length, 1));
    });
  });
  document.getElementById("b-reset").addEventListener("click", function () {
    budget = Object.assign({}, BUDGET_DEF, { manPrezzo: false }); saveBudget(); BKEYS.forEach(markDirty); render();
  });
}

function initRubrica() {
  var book = document.getElementById("book"), box = document.getElementById("bk-pages");
  if (!book) return;
  // altezza: tutto lo spazio fino alla barra in basso, senza scorrere
  var nav = document.querySelector(".tabbar"), bar = document.querySelector(".bk-bar");
  var top = book.getBoundingClientRect().top + window.scrollY;
  var H = Math.max(360, window.innerHeight - top - (nav ? nav.offsetHeight : 64) - (bar ? bar.offsetHeight : 40) - 14);
  book.style.height = H + "px";
  var extra = document.documentElement.scrollHeight - window.innerHeight;   // niente scorrimento della pagina
  if (extra > 0) { H = Math.max(340, H - extra); book.style.height = H + "px"; }

  // impaginazione: ogni cantone parte su una pagina nuova; se non ci sta, continua sulla pagina dopo
  var pages = [], kStart = {};
  function newPage(html) {
    var pg = document.createElement("div");
    pg.className = "pg"; pg.innerHTML = '<div class="pg-in">' + P(html || "") + '</div><span class="pg-n"></span>';
    box.appendChild(pg); pages.push(pg); return pg.firstChild;
  }
  function fits(inner) { return inner.scrollHeight <= inner.clientHeight + 1; }
  newPage("");   // indice, riempito dopo
  RB_KT.forEach(function (k) {
    var c = k[0], title = esc(CANTONI[c][0].toUpperCase()) + ' · ' + c;
    kStart[c] = pages.length;
    var inner = newPage('<h2>' + title + '</h2>');
    RB_CAT.forEach(function (cat) {
      var items = RUBRICA.filter(function (r) { return r[0] === c && r[1] === cat; });
      items.forEach(function (it, i) {
        var html = (i === 0 ? '<h3>' + cat.toUpperCase() + '</h3>' : '') + rbEntry(it);
        var blk = document.createElement("div"); blk.className = "blk"; blk.innerHTML = P(html);
        inner.appendChild(blk);
        if (!fits(inner) && inner.children.length > 1) {

function playStation() {
  var st = STATIONS[radioSt];
  if (st.app) {
    stopStation();
    var rr = document.getElementById("radio"); if (rr) rr.classList.remove("tuning");
    var w = null;
    try { w = window.open(st.app, "_blank"); if (w) w.opener = null; } catch (e) {}
    if (!w) location.href = st.app;
    return;
  }
  if (!radioAudio) {
    radioAudio = new Audio();
    radioAudio.preload = "none";
    radioAudio.addEventListener("playing", function () { var x = document.getElementById("radio"); if (x) x.classList.remove("tuning"); });
    radioAudio.addEventListener("waiting", function () { var x = document.getElementById("radio"); if (x && radioOn) x.classList.add("tuning"); });
    radioAudio.addEventListener("error", function () {
      if (!radioOn || !radioAudio.getAttribute("src")) return;
      var s2 = STATIONS[radioSt];
      if (srcTry + 1 < s2.src.length) { srcTry++; radioAudio.src = s2.src[srcTry]; var q = radioAudio.play(); if (q && q.catch) q.catch(function () {}); return; }
      var x = document.getElementById("radio"); if (x) x.classList.remove("tuning");
      toast(s2.name + " non risponde");
    });
  }
  var r = document.getElementById("radio"); if (r) r.classList.add("tuning");
  srcTry = 0;
  radioAudio.src = st.src[0];
  var pr = radioAudio.play(); if (pr && pr.catch) pr.catch(function () {});
  mediaSession();
}
function stopStation() {
  clearTimeout(switchTm);
  if (radioAudio) { radioAudio.pause(); radioAudio.removeAttribute("src"); radioAudio.load(); }
}

function setRadio(on) {
  if (on) radioSt = 3;   // ogni volta che si accende, la radio riparte da HPR3
  radioOn = on;
  radioUi();
  if (on) playStation(); else stopStation();
  try { if ("mediaSession" in navigator) navigator.mediaSession.playbackState = on ? "playing" : "paused"; } catch (e) {}
}
function selectStation(n) {
  n = +n;
  if (!radioOn || !STATIONS[n]) return;
  clickSound();
  if (n === radioSt) return;
  radioSt = n;
  radioUi();
  // tra una stazione e l'altra: fruscio di sintonia, poi parte la nuova
  if (STATIONS[n].app) { playStation(); return; }   // Spotify: si apre subito, senza fruscio
  stopStation();
  var r = document.getElementById("radio"); if (r) r.classList.add("tuning");
  staticSound();
  switchTm = setTimeout(function () { if (radioOn) playStation(); }, 1000);
}

// comandi sulla schermata di blocco e nelle notifiche (e titolo/copertina sull'autoradio via Bluetooth)
function mediaSession() {
  if (!("mediaSession" in navigator)) return;
  try {
    var n = radioSt, st = STATIONS[n];
    var meta = function (art) {
      if (n !== radioSt) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: st.big + (st.l1 ? " · " + st.l1.charAt(0) + st.l1.slice(1).toLowerCase() + " " + st.l2.charAt(0) + st.l2.slice(1).toLowerCase() : ""),
        artist: "Road trip d'Avvento", album: st.name,
        artwork: art ? [{ src: art, sizes: "512x512", type: "image/png" }] : [{ src: "icona2-512.png", sizes: "512x512", type: "image/png" }]
      });
    };
    meta(artCache[n]);
    if (!artCache[n]) stationArt(n).then(meta).catch(function () {});
    if (!mediaSession.done) {
      mediaSession.done = true;
      navigator.mediaSession.setActionHandler("play", function () { setRadio(true); });
      navigator.mediaSession.setActionHandler("pause", function () { setRadio(false); });
      navigator.mediaSession.setActionHandler("stop", function () { setRadio(false); });
      // frecce avanti / indietro (schermata di blocco, cuffie, autoradio): stazioni 1 → 5 a giro
      try {
        navigator.mediaSession.setActionHandler("nexttrack", function () { if (radioOn) selectStation(radioSt >= 5 ? 1 : radioSt + 1); });
        navigator.mediaSession.setActionHandler("previoustrack", function () { if (radioOn) selectStation(radioSt <= 1 ? 5 : radioSt - 1); });
      } catch (e2) {}
    }
  } catch (e) {}
}
function toggleRadio() {
  clickSound();

}
function initRadio() {
  var p = document.getElementById("pwr");
  p.addEventListener("click", toggleRadio);
  p.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleRadio(); } });
  document.getElementById("onair").addEventListener("click", toggleRadio);
  document.querySelectorAll("#radio .preset[data-st]").forEach(function (g) {
    g.addEventListener("click", function () { selectStation(g.getAttribute("data-st")); });
  });
  document.querySelectorAll(".st-row").forEach(function (row) {
    row.addEventListener("click", function () { selectStation(row.getAttribute("data-st")); });
  });
  var note = document.getElementById("note"), stk = document.getElementById("sticker");
  function openNote() { note.hidden = false; document.getElementById("note-x").focus(); }
  function closeNote() { note.hidden = true; }
  stk.addEventListener("click", openNote);
  stk.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openNote(); } });
  document.getElementById("note-x").addEventListener("click", closeNote);
  note.addEventListener("click", function (e) { if (e.target === note) closeNote(); });
  document.addEventListener("keydown", function esc(e) { if (!document.getElementById("note")) { document.removeEventListener("keydown", esc); return; } if (e.key === "Escape") closeNote(); });
}

var deferredInstall = null;
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault(); deferredInstall = e;

  refreshInstallBanner();
});

/* Banner "Installa l'app" in cima alla home: solo nel browser, non nell'app già installata. */
function isInstalled() {
  if (matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) return true;
  try { return localStorage.getItem("rta-installata") === "1"; } catch (e) { return false; }
}
function isIos() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function installBannerHtml() {
  if (isInstalled()) return "";
  try { var d = +localStorage.getItem("rta-dopo") || 0; if (Date.now() - d < 3 * 86400000) return ""; } catch (e) {}
  return '<section class="instbar" id="instbar"><img src="icona2-192.png" alt="" onerror="this.remove()">' +
    '<div class="instbar-t"><b>Installa l\'app sul telefono</b><span id="inst-aiuto"></span></div>' +
    '<div class="instbar-b"><button type="button" class="btn" id="inst-si">Installa</button><button type="button" class="linkbtn2" id="inst-dopo">Dopo</button></div></section>';
}
function refreshInstallBanner() {
  var box = document.getElementById("instbox");
  if (!box) return;
  box.innerHTML = installBannerHtml();
  var si = document.getElementById("inst-si"), dopo = document.getElementById("inst-dopo");
  if (dopo) dopo.onclick = function () { try { localStorage.setItem("rta-dopo", String(Date.now())); } catch (e) {} box.innerHTML = ""; };
  if (si) si.onclick = function () {
    if (deferredInstall) {
      deferredInstall.prompt();
      try { deferredInstall.userChoice.then(function (c) { if (c.outcome === "accepted") { try { localStorage.setItem("rta-installata", "1"); } catch (e) {} box.innerHTML = ""; } }); } catch (e) {}
      deferredInstall = null;
      return;
    }
    document.getElementById("inst-aiuto").innerHTML = isIos()
      ? "Su iPhone apri questa pagina con <b>Safari</b>, tocca <b>Condividi</b> (il quadrato con la freccia) e poi <b>Aggiungi alla schermata Home</b>."
      : "Tocca il menu <b>⋮</b> di Chrome in alto a destra e scegli <b>Installa app</b> (o <b>Aggiungi a schermata Home</b>).";
  };
}

        '<span class="g-nome">%%FAM%%</span>' +
